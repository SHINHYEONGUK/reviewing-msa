name: Deploy Static Assets to S3

on:
  push:
    branches:
      - main
      - compose-dhlee

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"    # ← CHANGED: 기존 "16"에서 "22.x"로 상향

      - name: 의존성 설치 & 빌드
        working-directory: front/reviewing
        run: |
          npm ci
          npm run build

      # --- 디버그: 빌드 결과 확인 ---
      - name: 빌드 폴더 상태 확인
        working-directory: front/reviewing
        run: |
          echo "현재 디렉터리: $(pwd)"
          echo "파일 목록:"
          ls -R .

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-northeast-2

      # --- 디버그: 동기화 전 S3 상태 ---
      - name: S3 동기화 전 객체 목록
        run: |
          aws s3 ls s3://${{ secrets.S3_BUCKET }}/ --recursive || echo "버킷에 접근 실패 또는 빈 버킷"

      - name: S3에 동기화
        working-directory: front/reviewing
        run: |
               aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
               --delete \
          #         --acl public-read \   # ← CHANGED: ACL 비활성화된 버킷이므로 제거
               --cache-control "max-age=31536000,public"

      # --- 디버그: 동기화 후 S3 상태 ---
      - name: S3 동기화 후 객체 목록
        run: |
          aws s3 ls s3://${{ secrets.S3_BUCKET }}/ --recursive
